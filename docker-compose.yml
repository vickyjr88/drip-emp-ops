
# Shared by the two backend/web service pairs below (the active slot and its
# rolling-deploy standby), so the two never drift apart on anything but the
# one thing that has to differ: which host port each is published on. See
# scripts/deploy.sh for how the two slots are actually swapped during a
# deploy -- this file only defines that both can run at once.
x-web-build: &web-build
  context: ./web
  dockerfile: Dockerfile
  args:
    - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3101}
    - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
    - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
    - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    - NEXT_PUBLIC_META_PIXEL_ID=${NEXT_PUBLIC_META_PIXEL_ID:-}
    - NEXT_PUBLIC_X_PIXEL_ID=${NEXT_PUBLIC_X_PIXEL_ID:-}
    - NEXT_PUBLIC_TIKTOK_PIXEL_ID=${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
    - NEXT_PUBLIC_MEDIA_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}

x-web-environment: &web-environment
  INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:3100}
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3101}
  NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}

x-web-healthcheck: &web-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/ || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_BUCKET: ${MINIO_BUCKET:-project-media}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
  BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-}
  STOREFRONT_ORIGIN: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-}
  BILLIONMAIL_API_KEY: ${BILLIONMAIL_API_KEY:-}
  BILLIONMAIL_BASE_URL: ${BILLIONMAIL_BASE_URL:-}
  BILLIONMAIL_SENDER_EMAIL: ${BILLIONMAIL_SENDER_EMAIL:-}
  INQUIRY_FALLBACK_EMAIL: ${INQUIRY_FALLBACK_EMAIL:-}
  ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
  ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
  FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  AT_API_KEY: ${AT_API_KEY:-}
  AT_USERNAME: ${AT_USERNAME:-sandbox}
  AT_SENDER_ID: ${AT_SENDER_ID:-}
  REMINDERS_CRON: ${REMINDERS_CRON:-0 8 * * *}
  REMINDERS_TIMEZONE: ${REMINDERS_TIMEZONE:-Africa/Nairobi}

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-backend-depends-on: &backend-depends-on
  db:
    condition: service_healthy
  minio:
    condition: service_started
  redis:
    condition: service_healthy

services:
  # Two slots per app, "web"/"web2" and "backend"/"backend2", so a deploy can
  # bring the idle slot up on the new image, wait for its healthcheck, cut
  # nginx's upstream over to it, and only then stop the slot that was serving
  # -- see scripts/deploy.sh. Exactly one slot is meant to be running outside
  # of a deploy; which one is active is tracked by deploy.sh, not by Compose.
  web:
    build: *web-build
    ports:
      # host:container. Next binds 3002 inside the container; this slot is
      # reached on WEB_PORT from the host. See scripts/deploy.sh for why both
      # this and web2's port need to sit in nginx's upstream pool together.
      - "${WEB_PORT:-3003}:3002"
    environment: *web-environment
    healthcheck: *web-healthcheck
    depends_on:
      - backend
    restart: unless-stopped

  web2:
    build: *web-build
    ports:
      - "${WEB_PORT2:-3004}:3002"
    environment: *web-environment
    healthcheck: *web-healthcheck
    depends_on:
      - backend
    # Not started by a plain `docker compose up -d` -- only deploy.sh brings
    # this up, on purpose, during a rolling swap. `docker compose --profile
    # standby up -d` would also start it, if that is ever wanted directly.
    profiles: ["standby"]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # All interfaces, same reasoning as the web service: the nginx container
      # cannot reach a host loopback binding. Closed off by the firewall.
      - "${API_PORT:-3101}:3100"
    environment:
      <<: *backend-environment
      # Set false on replicas so only one instance runs the scheduler. The
      # standby slot below is the one this actually matters for now.
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
    healthcheck: *backend-healthcheck
    depends_on: *backend-depends-on
    restart: unless-stopped

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT2:-3102}:3100"
    environment:
      <<: *backend-environment
      # Never true for this slot: two schedulers double-sending reminder
      # SMS/emails is the exact failure this flag exists to prevent, and
      # deploy.sh brings this slot up alongside, not instead of, the active
      # one during a swap.
      REMINDERS_ENABLED: "false"
    healthcheck: *backend-healthcheck
    depends_on: *backend-depends-on
    profiles: ["standby"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF so queued reminder jobs survive a restart rather than being lost.
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    ports:
      # Bound to the loopback interface. Published as 0.0.0.0 this is an open
      # Redis on a public Contabo IP, which takes no password at all by default.
      # Nothing outside the Compose network needs it; the backend reaches it as
      # `redis:6379` over the internal network, not through this mapping.
      - "127.0.0.1:${REDIS_PORT:-16380}:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      # -d is not optional: without it libpq defaults the database name to the
      # username, so a POSTGRES_USER that is not also a database name fails with
      # 'database "<user>" does not exist'. That went unnoticed while the user
      # was `postgres`, which always has a matching database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only. Published on all interfaces this is the customer database
      # exposed to the internet behind nothing but POSTGRES_PASSWORD. The mapping
      # is kept for psql/pg_dump over an SSH tunnel; the backend and backup.sh
      # both reach Postgres as `db:5432` inside the Compose network instead.
      - "127.0.0.1:${DB_PORT:-15433}:5432"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # The S3 port is on all interfaces because nginx proxies it to serve
      # uploaded media (MEDIA_PUBLIC_BASE_URL), and nginx runs in a container
      # that cannot reach a host loopback binding. The firewall keeps it closed
      # from outside; only 80/443 are open.
      - "${MINIO_HOST_PORT:-19002}:9000"
      # The console stays on loopback regardless: it is an admin login, nothing
      # proxies it, and it has no business being on a public IP. Reach it with
      # an SSH tunnel: ssh -L 19003:127.0.0.1:19003 user@host
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19003}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
