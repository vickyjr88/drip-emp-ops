

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so these have to be build
        # args. Setting them only at runtime leaves the browser bundle pointing at
        # the localhost defaults and the deployed site cannot reach the API.
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3101}
        # The site's own public origin, used for canonical URLs, Open Graph tags,
        # sitemap.xml and robots.txt -- all of which are absolute. Left at the
        # localhost default in production, every canonical would point at
        # localhost and the site would effectively de-index itself.
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
        # Paystack's publishable key. Not used today: checkout redirects to a
        # URL the server creates with the secret key, so the browser never
        # needs a key of its own. Wired through for the inline popup, which
        # would need it, and safe in the bundle either way -- it identifies the
        # merchant; only the secret key can move money.
        - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
    ports:
      # host:container. Next binds 3002 inside the container and logs that
      # port on startup -- the site is reached on WEB_PORT from the host.
      #
      # Loopback only: nginx terminates TLS and proxies to this port from the
      # same host. Published on 0.0.0.0 the site is also reachable on
      # http://<ip>:3003, bypassing TLS and the panel's vhost entirely.
      # Set WEB_BIND=0.0.0.0 for a bare host with no reverse proxy in front.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3003}:3002"
    environment:
      # Server-side rendering runs inside this container, where localhost is the
      # web app itself. Server fetches must go to the backend service directly;
      # the browser keeps using NEXT_PUBLIC_API_BASE_URL. Read at runtime, so it
      # needs no rebuild to change.
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://backend:3100}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Loopback only, same reasoning as the web service: nginx proxies the
      # public API origin here. Override with API_BIND=0.0.0.0 if the API must
      # be reachable directly, without a proxy in front.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3101}:3100"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # No default: auth falls back to a hardcoded dev key when this is unset,
      # which would let anyone mint admin tokens against a deployed instance.
      # Compose errors on an empty value, so a misconfigured host fails loudly.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_BUCKET=${MINIO_BUCKET:-project-media}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-}
      # Where the customer's browser is. Paystack callbacks and password-reset
      # links must point at the storefront, not at this API -- derived from the
      # request they would point at :3101, where those pages do not exist.
      - STOREFRONT_ORIGIN=${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
      # Paystack. The secret key never leaves the server; without it the API
      # reports checkout as unavailable and refuses to take an order.
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - SMTP_REJECT_UNAUTHORIZED=${SMTP_REJECT_UNAUTHORIZED:-}
      - BILLIONMAIL_API_KEY=${BILLIONMAIL_API_KEY:-}
      - BILLIONMAIL_BASE_URL=${BILLIONMAIL_BASE_URL:-}
      - BILLIONMAIL_SENDER_EMAIL=${BILLIONMAIL_SENDER_EMAIL:-}
      - INQUIRY_FALLBACK_EMAIL=${INQUIRY_FALLBACK_EMAIL:-}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL:-}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Africa's Talking. Blank key => reminder SMS is skipped and logged
      # rather than failing the run, matching how Brevo behaves.
      - AT_API_KEY=${AT_API_KEY:-}
      - AT_USERNAME=${AT_USERNAME:-sandbox}
      - AT_SENDER_ID=${AT_SENDER_ID:-}
      # Set false on replicas so only one instance runs the scheduler.
      - REMINDERS_ENABLED=${REMINDERS_ENABLED:-true}
      - REMINDERS_CRON=${REMINDERS_CRON:-0 8 * * *}
      - REMINDERS_TIMEZONE=${REMINDERS_TIMEZONE:-Africa/Nairobi}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF so queued reminder jobs survive a restart rather than being lost.
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    ports:
      # Bound to the loopback interface. Published as 0.0.0.0 this is an open
      # Redis on a public Contabo IP, which takes no password at all by default.
      # Nothing outside the Compose network needs it; the backend reaches it as
      # `redis:6379` over the internal network, not through this mapping.
      - "127.0.0.1:${REDIS_PORT:-16380}:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Loopback only. Published on all interfaces this is the customer database
      # exposed to the internet behind nothing but POSTGRES_PASSWORD. The mapping
      # is kept for psql/pg_dump over an SSH tunnel; the backend and backup.sh
      # both reach Postgres as `db:5432` inside the Compose network instead.
      - "127.0.0.1:${DB_PORT:-15433}:5432"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # Loopback only, for both. nginx proxies the S3 API port to serve uploaded
      # media publicly (see MEDIA_PUBLIC_BASE_URL in docs/DEPLOYMENT.md), and it
      # runs on this host, so it reaches 127.0.0.1 fine. The console is an admin
      # login that has no business being on a public IP -- reach it through an
      # SSH tunnel: ssh -L 19003:127.0.0.1:19003 user@host
      - "127.0.0.1:${MINIO_HOST_PORT:-19002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19003}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
