
# Shared by the two backend/web service pairs below (the active slot and its
# rolling-deploy standby), so the two never drift apart on anything but the
# one thing that has to differ: which host port each is published on. See
# scripts/deploy.sh for how the two slots are actually swapped during a
# deploy -- this file only defines that both can run at once.
x-web-build: &web-build
  context: ./web
  dockerfile: Dockerfile
  args:
    - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3101}
    - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3003}
    - NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY=${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
    - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
